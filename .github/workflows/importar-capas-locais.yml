name: Importar e validar capas locais
on:
  push:
    paths:
      - '.github/workflows/importar-capas-locais.yml'
      - 'scripts/importar_capas_locais.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: importar-capas-locais
  cancel-in-progress: false
jobs:
  staging:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar biblioteca de imagens
        run: python -m pip install --quiet requests pillow
      - name: Baixar, limitar a 1024px e converter para WebP
        run: python scripts/importar_capas_locais.py
      - name: Publicar somente imagens e relatório, sem alterar o site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/covers relatorios/importacao-capas-locais.json
          if ! git diff --cached --quiet; then
            git commit -m "Prepara imagens locais otimizadas sem migrar as URLs"
            git push
          fi
