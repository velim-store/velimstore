    <path d="M541 594 C569 633 565 740 580 818" stroke-width="20" fill="none"/>
    <path d="M555 558 C582 531 593 550 602 569" stroke-width="17" fill="none"/>
    <path d="M422 563 C399 493 369 468 329 430" stroke-width="18" fill="none"/>
    <path d="M378 472 L327 451 308 514" stroke-width="12" fill="none"/>
    <path d="M397 603 L343 639 321 750" stroke-width="15" fill="none"/>
    <path d="M411 650 L383 700 360 849" stroke-width="12" fill="none"/>
  </g>
