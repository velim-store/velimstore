  <rect x="19" y="485" width="562" height="370" fill="url(#fog)"/>
  <!-- Spider, framed by darkness and subtle atmospheric silhouette -->
  <g fill="#070809" stroke="#070809" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="516" cy="564" rx="87" ry="93"/>
    <ellipse cx="451" cy="582" rx="34" ry="40"/>
    <path d="M477 560 C431 527 408 558 393 601" stroke-width="22" fill="none"/>
    <path d="M477 580 C417 573 408 620 369 655" stroke-width="21" fill="none"/>
