  <path d="M20 787 Q102 759 143 784 Q203 771 255 786 Q338 766 401 782 Q491 752 581 783 L581 951 L19 951Z" fill="#050606"/>
  <g stroke="#0a0b0b" stroke-linecap="round" stroke-linejoin="round" fill="#050606">
    <path d="M247 739 Q235 730 239 719 Q244 695 264 694 Q286 695 290 716 Q290 731 274 740Z" stroke-width="2"/>
    <path d="M253 732 Q245 745 249 781 L274 781 275 738Z"/>
    <path d="M256 777 L250 817 244 824" stroke-width="11" fill="none"/>
    <path d="M270 777 L280 813 288 818" stroke-width="11" fill="none"/>
    <path d="M250 750 L232 773" stroke-width="9" fill="none"/>
    <path d="M274 748 L291 766" stroke-width="9" fill="none"/>
  </g>
  <circle cx="281" cy="717" r="2.6" fill="#eeeeee"/>
  <!-- Tall grass blades -->
  <g stroke="#161818" stroke-linecap="round" opacity=".93">
    <path d="M20 828 L51 751 M36 844 L72 761 M96 834 L85 754 M128 833 L150 772 M164 833 L144 755 M199 831 L220 763 M306 837 L327 760 M350 836 L365 745 M402 842 L425 768 M459 834 L452 755 M499 840 L532 760 M554 839 L565 781" stroke-width="3"/>
    <path d="M20 850 L32 791 M75 842 L61 785 M169 839 L185 779 M229 842 L208 802 M309 849 L296 796 M394 853 L384 783 M509 844 L482 799 M575 842 L558 792" stroke-width="2"/>
  </g>
  <!-- Cover title with subtle shadow -->
  <text x="306" y="343" font-size="110" font-weight="900" font-stretch="condensed" text-anchor="middle" font-family="Impact, Arial Black, sans-serif" fill="#d6d6d6" opacity=".25" letter-spacing="2">LIMBO</text>
  <text x="306" y="336" font-size="110" font-weight="900" font-stretch="condensed" text-anchor="middle" font-family="Impact, Arial Black, sans-serif" fill="#fcfcfc" letter-spacing="2">LIMBO</text>
  <!-- Switch 1 physical packaging, red spine and top-left brand -->
  <rect x="19" y="19" width="21" height="932" fill="url(#switchRed)"/>
  <rect x="19" y="19" width="170" height="160" fill="url(#switchRed)"/>
  <path d="M97 37 C97 32 103 29 108 29 H119 V116 H108 C101 116 97 111 97 105Z" fill="none" stroke="#fff" stroke-width="7"/>
  <path d="M130 29 H140 C148 29 151 35 151 42 V103 C151 111 147 116 140 116 H130Z" fill="#fff"/>
  <circle cx="112" cy="56" r="6" fill="#fff"/>
  <circle cx="136" cy="87" r="6" fill="#e20a15"/>
  <text x="104" y="140" text-anchor="middle" font-size="15" font-family="Arial,sans-serif" letter-spacing="2" font-weight="800" fill="#fff">NINTENDO</text>
  <text x="104" y="160" text-anchor="middle" font-size="19" font-family="Arial,sans-serif" letter-spacing="1" font-weight="900" fill="#fff">SWITCH</text>
  <!-- Rating badge and developer logo -->
  <rect x="49" y="831" width="82" height="104" fill="#fff" stroke="#0a0a0a" stroke-width="4"/>
  <rect x="53" y="835" width="74" height="17" fill="#fff" stroke="#0a0a0a" stroke-width="1.5"/>
  <text x="90" y="850" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#111">TEEN</text>
  <text x="90" y="913" text-anchor="middle" font-family="Arial Black,Arial,sans-serif" font-size="64" font-weight="900" fill="#111">T</text>
  <rect x="53" y="915" width="74" height="16" fill="#111"/>
  <text x="90" y="928" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="900" letter-spacing="2" fill="#fff">ESRB</text>
  <text x="562" y="918" text-anchor="end" font-family="Impact, Arial Black, sans-serif" font-size="31" font-weight="900" fill="#f0f0f0">PLAYDEAD</text>
  <rect x="19" y="19" width="562" height="932" fill="url(#reflection)" pointer-events="none"/>
</g>
<!-- Edges and glossy case rim -->
<rect x="18" y="17" width="564" height="934" rx="3" fill="none" stroke="#f4f4f4" stroke-width="3" opacity=".62"/>
<path d="M13 28 Q13 12 30 12 H570 Q587 12 587 28 V941 Q587 958 570 958 H29 Q13 958 13 941Z" fill="none" stroke="#fff" stroke-opacity=".65" stroke-width="5"/>
<path d="M11 32 V930" stroke="#fff" stroke-opacity=".62" stroke-width="3"/>
<path d="M589 45 V917" stroke="#fff" stroke-opacity=".74" stroke-width="4"/>
</svg>