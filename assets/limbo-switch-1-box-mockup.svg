<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 970" width="600" height="970" role="img" aria-labelledby="title desc">
<title id="title">LIMBO — mockup de caixa Nintendo Switch 1</title>
<desc id="desc">Capa ilustrativa não oficial, em estilo caixa física de Switch 1, com garoto numa floresta enevoada e silhueta de aranha.</desc>
<defs>
  <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
    <stop stop-color="#020304"/><stop offset=".38" stop-color="#0b0c0e"/>
    <stop offset=".66" stop-color="#4b4b4b"/><stop offset=".83" stop-color="#9b9b9b"/>
    <stop offset="1" stop-color="#0a0a0a"/>
  </linearGradient>
  <linearGradient id="fog" x1="0" y1="0" x2="0" y2="1">
    <stop stop-color="#dadada" stop-opacity="0"/><stop offset=".53" stop-color="#bcbcbc" stop-opacity=".24"/>
    <stop offset=".78" stop-color="#d8d8d8" stop-opacity=".57"/><stop offset="1" stop-color="#161616" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="case" x1="0" y1="0" x2="1" y2="0">
    <stop stop-color="#f4f4f4"/><stop offset=".05" stop-color="#a3a5a8"/><stop offset=".12" stop-color="#eeeeee"/>
    <stop offset=".87" stop-color="#cecece"/><stop offset=".94" stop-color="#ffffff"/><stop offset="1" stop-color="#777"/>
  </linearGradient>
  <linearGradient id="reflection" x1="0" y1="0" x2=".5" y2="1">
    <stop stop-color="#fff" stop-opacity=".22"/><stop offset=".2" stop-color="#fff" stop-opacity=".07"/>
    <stop offset=".5" stop-color="#fff" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="switchRed" x1="0" y1="0" x2="1" y2=".5">
    <stop stop-color="#f51620"/><stop offset="1" stop-color="#df0611"/>
  </linearGradient>
  <radialGradient id="softFog" cx=".48" cy=".75" r=".42">
    <stop stop-color="#e3e3e3" stop-opacity=".53"/><stop offset="1" stop-color="#cccccc" stop-opacity="0"/>
  </radialGradient>
  <clipPath id="artClip"><rect x="19" y="19" width="562" height="932" rx="3"/></clipPath>
  <filter id="mistBlur"><feGaussianBlur stdDeviation="21"/></filter>
</defs>
<!-- Clear plastic case with highlights -->
<rect x="3" y="3" width="594" height="964" rx="18" fill="url(#case)"/>
<rect x="9" y="8" width="582" height="954" rx="13" fill="#d8d8d8"/>
<rect x="15" y="15" width="572" height="943" rx="8" fill="#454545"/>
<g clip-path="url(#artClip)">
  <rect x="19" y="19" width="562" height="932" fill="url(#paper)"/>
  <!-- Mist and silhouettes -->
  <g opacity=".65" fill="#08090a">
    <path d="M85 420 L86 730 74 730 78 425 67 329 88 389 92 291 101 394 114 360Z"/>
    <path d="M164 344 L167 751 152 749 158 375 144 305 162 342 170 247 171 375 188 329Z"/>
    <path d="M260 369 L264 721 251 727 253 375 242 317 260 354 276 293 267 393 286 359Z"/>
    <path d="M351 345 L349 691 342 688 347 348 330 297 352 336 365 261 356 373 376 340Z"/>
    <path d="M537 380 L529 745 520 744 525 393 514 324 540 368 547 297 536 407 551 378Z"/>
  </g>
