<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Seleção de Jogos Switch</title>
  <link rel="icon" type="image/png" sizes="64x64" href="./favicon.png?v=1" />
  <style>
    :root{
      --bg:#0b0f14;
      --card:#121a24;
      --card2:#0f1620;
      --text:#e9eef6;
      --muted:#a9b4c2;
      --accent:#4da3ff;
      --danger:#ff5a6a;
      --ok:#2fd27c;

      --cover-ratio: 300 / 485;  /* proporção de capa */
      --gap:10px;
      --cols:5; /* 5 por linha */
    }

    *{ box-sizing:border-box; }
    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background:var(--bg);
      color:var(--text);
    }

    header{
      position: sticky;
      top: 0;
      z-index: 20;
      background: linear-gradient(180deg, rgba(11,15,20,0.98), rgba(11,15,20,0.86));
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255,255,255,0.06);
      padding: 12px 12px 10px;
    }

    .title-row{
      display:flex;
      gap:10px;
      align-items:center;
      justify-content:space-between;
      margin-bottom:10px;
    }

    h1{
      font-size: 16px;
      margin: 0;
      letter-spacing: .2px;
      font-weight: 700;
    }

    .pill{
      font-size: 12px;
      color: var(--muted);
      border: 1px solid rgba(255,255,255,0.12);
      padding: 6px 10px;
      border-radius: 999px;
      display:flex;
      gap:8px;
      align-items:center;
      white-space:nowrap;
    }

    .controls{
      display:flex;
      gap:10px;
      align-items:center;
    }

    .search{
      flex: 1;
      display:flex;
      gap:10px;
      align-items:center;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 12px;
      padding: 10px 10px;
    }
    .search input{
      width: 100%;
      background: transparent;
      border: 0;
      outline: none;
      color: var(--text);
      font-size: 14px;
    }
    .search input::placeholder{ color: rgba(233,238,246,0.45); }

    .btn{
      border: 1px solid rgba(255,255,255,0.14);
      background: rgba(255,255,255,0.06);
      color: var(--text);
      padding: 10px 12px;
      border-radius: 12px;
      font-weight: 650;
      font-size: 13px;
      cursor:pointer;
    }
    .btn:active{ transform: translateY(1px); }
    .btn.primary{
      border-color: rgba(77,163,255,0.55);
      background: rgba(77,163,255,0.18);
    }
    .btn.danger{
      border-color: rgba(255,90,106,0.55);
      background: rgba(255,90,106,0.16);
    }
    .btn:disabled{
      cursor: wait;
      opacity: 0.9;
    }
    .btn.success{
      border-color: rgba(47,210,124,0.75);
      background: rgba(47,210,124,0.25);
    }
    .btn.error{
      border-color: rgba(255,90,106,0.75);
      background: rgba(255,90,106,0.25);
    }

    main{
      padding: 12px 12px 120px;
    }

    .instructions{
      margin-bottom: 14px;
      padding: 14px;
      border: 1px solid rgba(77,163,255,0.25);
      border-radius: 12px;
      background: rgba(77,163,255,0.08);
    }
    .instructions h2{
      margin: 0 0 10px;
      color: var(--text);
      font-size: 14px;
      font-weight: 750;
    }
    .instructions ol{
      display: flex;
      flex-direction: column;
      gap: 8px;
      list-style: none;
      padding: 0;
      margin: 0;
    }
    .instructions li{
      display: flex;
      align-items: flex-start;
      gap: 9px;
      font-size: 13px;
      line-height: 1.45;
      color: var(--muted);
    }
    .step-number{
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 24px;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: rgba(77,163,255,0.20);
      color: var(--accent);
      font-size: 12px;
      font-weight: 800;
    }

    .grid{
      display:grid;
      grid-template-columns: repeat(var(--cols), minmax(0, 1fr));
      gap: var(--gap);
    }

    .card{
      user-select:none;
      border-radius: 3px;
      overflow:hidden;
      background: var(--card);
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow: 0 6px 18px rgba(0,0,0,0.25);
      cursor:pointer;
      position:relative;
      display:flex;
      flex-direction:column;
      min-width:0;
    }

    .cover{
      width:100%;
      aspect-ratio: var(--cover-ratio);
      background: linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
      position:relative;
      overflow:hidden;
    }

    .cover img{
      width:100%;
      height:100%;
      /* antes: object-fit: cover; */
      object-fit: contain;   /* não corta */
      transform: none;       /* antes estava scale(1.02), isso também “corta” visualmente */
      background: #0f1620;   /* cor nas “bordas” caso sobrem barras */
    }
    /* Recorta somente o fundo branco externo da foto frontal do Silksong. */
    .cover img.silksong-front-case{
      object-fit: cover;
      object-position: 52% 49%;
      transform: scale(1.04);
      background: #0f1620;
    }
    /* Recorta apenas as margens externas da foto quadrada do Horizon Chase Turbo. */
    .cover img.horizon-chase-turbo-case{
      object-fit: cover;
      object-position: center;
    }
    /* Capa física frontal do Switch 1: recorta só o fundo branco da foto de loja. */
    .cover img.mk-legacy-physical-case{
      object-fit: cover;
      object-position: 52% center;
      transform: scale(1.10);
    }
    /* Fotos quadradas de caixas Switch 1: preenchem o card, removendo apenas as faixas laterais. */
    .cover img.catalog-square-front{
      object-fit: cover;
      object-position: center;
    }
    /* Limbo: cobre os 300:485 da caixa sem cortar a moldura do mockup original. */
    .cover img.limbo-ratio-fixed{
      object-fit: fill;
      transform: none;
    }
    /* Fotos de lojas em formato quadrado: mantêm a frente da caixa Switch 1 sem barras laterais largas. */
    .cover img.retail-front-case{
      object-fit: cover;
      object-position: center;
      transform: none;
    }
    .cover img.castlevania-dominus-front{
      /* A imagem da loja contém faixas brancas laterais: ocupar a altura da caixa
         e cortar as laterais externas sem deformar a ilustração. */
      width:100%;
      height:100%;
      object-fit:cover;
      object-position:center center;
      transform:none;
    }
    /* Mega Man Legacy 1+2: imagem quadrada com faixas brancas nas laterais.
       Mantém a caixa na altura do card e recorta somente as laterais. */
    .cover img.megaman-legacy-1-2-front{
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
      transform: none;
    }
    /* Trial Rising: preencher a altura, recortar as faixas brancas laterais
       sem distorcer a arte. */
    .cover img.trial-rising-front{
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
      transform: none;
    }
    /* Nintendo Entertainment System Online: mantém o topo, ocupa a altura
       e recorta as faixas laterais sem distorcer a proporção da imagem. */
    .cover img.nes-switch-online-front{
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
      transform: none;
    }
    /* Transformers Battlegrounds: ocupa a altura até o topo e corta
       as bordas brancas laterais mantendo a proporção original. */
    .cover img.transformers-battlegrounds-front{
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
      transform: none;
    }

    .meta{
      padding: 8px 8px 10px;
      background: linear-gradient(180deg, var(--card), var(--card2));
      display:flex;
      flex-direction:column;
      gap:6px;
      min-height: 56px;
    }

    .name{
      font-size: 11px;
      line-height: 1.1;
      font-weight: 750;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow:hidden;
      text-overflow: ellipsis;
      color: var(--text);
    }

    .size{
      font-size: 11px;
      color: var(--muted);
      font-weight: 650;
    }

    .badge{
      position:absolute;
      top:8px;
      left:8px;
      background: rgba(0,0,0,0.55);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 999px;
      padding: 4px 8px;
      font-size: 11px;
      font-weight: 800;
      display:none;
    }

    .selected{
      outline: 2px solid rgba(47,210,124,0.85);
      outline-offset: 0px;
    }
    .selected .badge{ display:block; }

    /* Em telas pequenas as cinco colunas estreitam o selo.
       Ajusta o badge dentro da capa, mantendo "Selecionado" inteiro. */
    @media (max-width: 767px){
      .cover .badge{
        top: 4px;
        left: 2px;
        right: 2px;
        width: auto;
        padding: 3px 1px;
        font-size: clamp(7px, 2.1vw, 9px);
        line-height: 1.2;
        letter-spacing: -0.25px;
        text-align: center;
        white-space: nowrap;
      }
    }

    footer{
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 30;
      padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
      background: linear-gradient(180deg, rgba(11,15,20,0.2), rgba(11,15,20,0.95));
      border-top: 1px solid rgba(255,255,255,0.08);
      backdrop-filter: blur(10px);
    }

    .footer-row{
      display:flex;
      gap:10px;
      align-items:center;
      justify-content:space-between;
    }

    .summary{
      display:flex;
      flex-direction:column;
      gap:4px;
      min-width:0;
    }
    .summary .big{
      font-weight: 900;
      font-size: 15px;
    }
    .summary .small{
      font-size: 12px;
      color: var(--muted);
      white-space:nowrap;
      overflow:hidden;
      text-overflow: ellipsis;
      max-width: 55vw;
    }

    .footer-actions{
      display:flex;
      gap:10px;
      align-items:center;
    }

    .toast{
      position: fixed;
      left: 12px;
      right: 12px;
      bottom: 86px;
      z-index: 40;
      padding: 10px 12px;
      border-radius: 12px;
      background: rgba(0,0,0,0.7);
      border: 1px solid rgba(255,255,255,0.14);
      display:none;
      font-size: 13px;
      color: var(--text);
    }
    .toast.show{ display:block; }
    .toast.success{
      border-color: rgba(47,210,124,0.65);
      background: rgba(12,56,36,0.96);
    }
    .toast.error{
      border-color: rgba(255,90,106,0.65);
      background: rgba(78,20,29,0.96);
    }
  </style>
</head>

    /***********************************************************
     *  CAPAS: carregar covers.json e preencher g.imageUrl
     ***********************************************************/
    async function applyCoversFromJson(){
      try{
        const covers = await fetch("./covers.json", { cache: "no-store" }).then(r => {
          if(!r.ok) throw new Error(`HTTP ${r.status}`);
          return r.json();
        });

        const coverByName = Object.create(null);
        for (const c of covers){
          if (c?.name) coverByName[c.name] = (c.imageUrl && typeof c.imageUrl === "string") ? c.imageUrl.trim() : "";
        }

        for (const g of GAMES){
          const url = coverByName[g.name];
          if (url) g.imageUrl = url;
        }
      }catch(err){
        console.warn("Não foi possível carregar covers.json (seguindo com placeholders).", err);
      }
    }

    /***********************************************************
     *  STATE
     ***********************************************************/
    const state = { selected: new Set(), query: "" };

    const elGrid = document.getElementById("grid");
    const elQ = document.getElementById("q");
    const elSumGB = document.getElementById("sumGB");
    const elSumCount = document.getElementById("sumCount");
    const elPillInfo = document.getElementById("pillInfo");
    const elToast = document.getElementById("toast");

    function showToast(msg, type = ""){
      elToast.textContent = msg;
      elToast.classList.remove("success", "error");
      if(type) elToast.classList.add(type);
      elToast.classList.add("show");
      clearTimeout(showToast._t);
      showToast._t = setTimeout(()=> elToast.classList.remove("show", "success", "error"), 4500);
    }

    function formatGB(n){
      return (Number(n) || 0).toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    // Exibe arquivos pequenos na unidade original, sem arredondar MB para GB.
    // Os totais e cálculos continuam sempre em GB.
    function formatGameSize(sizeGB){
      const gb = Number(sizeGB) || 0;
      if(gb < 1) return `${formatGB(gb * 1024)} MB`;
      return `${formatGB(gb)} GB`;
    }

    function getTotalGB(){
      let sum = 0;
      for (const i of state.selected){
        const size = GAMES[i]?.sizeGB;
        if (typeof size === "number" && isFinite(size)) sum += size;
      }
      return sum;
    }

    function updateSummary(){
      const total = getTotalGB();
      const count = state.selected.size;
      elSumGB.textContent = `Total: ${formatGB(total)} GB`;
      elSumCount.textContent = `${count} item(ns) selecionado(s)`;
      elPillInfo.textContent = `${count} selecionados • ${formatGB(total)} GB`;
    }

    function placeholderSVG(title){
      const safe = (title || "Capa").replace(/[<>&"]/g, "");
      const svg =
`<svg xmlns="http://www.w3.org/2000/svg" width="600" height="840">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a2a3a"/>
      <stop offset="1" stop-color="#0f1620"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#g)"/>
  <rect x="40" y="40" width="520" height="760" rx="28" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.16)"/>
  <text x="300" y="420" text-anchor="middle" font-family="Arial, sans-serif" font-weight="800" font-size="42" fill="rgba(233,238,246,0.92)">${safe}</text>
  <text x="300" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-weight="600" font-size="22" fill="rgba(169,180,194,0.85)">Sem imagem</text>
</svg>`;
      return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
    }

    function matchesQuery(name, q){
      if(!q) return true;
      return name.toLowerCase().includes(q.toLowerCase());
    }

    const RETAIL_CASE_TITLES = new Set(["Castlevania Advance Collection","Castlevania Dominus Collection","Contra Operation Galuga","Disney Epic Mickey Rebrushed","Prince of Persia the Lost Crown","Bluey the Videogame","Mario vs. Donkey Kong","Dragon Ball Sparking Zero","Mighty Morphin Power Rangers Rita's Rewind","WRC 10","Demon Slayer The Hinokami Chronicles Kimetsu no Yaiba","Hot Wheels Unleashed 2 Turbocharged","Transformers Galactic Trials","Naruto x Boruto Ultimate Ninja Storm Connections","Little Nightmares III"]);

    function render(){
      elGrid.innerHTML = "";
      const q = state.query.trim();
      const frag = document.createDocumentFragment();

      GAMES.forEach((g, idx) => {
        if (!matchesQuery(g.name, q)) return;

        const card = document.createElement("div");
        card.className = "card" + (state.selected.has(idx) ? " selected" : "");
        card.dataset.index = String(idx);

        const cover = document.createElement("div");
        cover.className = "cover";

        const badge = document.createElement("div");
        badge.className = "badge";
        badge.textContent = "Selecionado";

        const img = document.createElement("img");
        img.alt = g.name;
        if (g.name === "Hollow Knight: Silksong") {
          img.classList.add("silksong-front-case");
        }
        if (g.name === "Horizon Chase Turbo") {
          img.classList.add("horizon-chase-turbo-case");
        }
        if (g.name === "Mortal Kombat Legacy Kollection") {
          img.classList.add("mk-legacy-physical-case");
        }
        if (g.name === "Dragon Ball FighterZ" ||
            g.name === "Dragon Ball Z Kakarot + A New Power Awakens Set" ||
            g.name === "Marvel vs Capcom Fighting Collection Arcade Classics" ||
            g.name === "Mega Man X Legacy Collection 1+2" ||
            g.name === "My Sims Cozy Bundle" ||
            g.name === "Grounded" ||
            g.name === "Ninja Gaiden - Master Collection") {
          img.classList.add("catalog-square-front");
        }
        if (g.name === "Limbo") {
          img.classList.add("limbo-ratio-fixed");
        }
        if (RETAIL_CASE_TITLES.has(g.name)) {
          img.classList.add("retail-front-case");
        }
        if (g.name === "Castlevania Dominus Collection") {
          img.classList.add("castlevania-dominus-front");
        }
        if (g.name === "Mega Man Legacy Collection 1 + 2") {
          img.classList.add("megaman-legacy-1-2-front");
        }
        if (g.name === "Trial Rising") {
          img.classList.add("trial-rising-front");
        }
        if (g.name === "Nintendo Entertainment System – Nintendo Switch Online") {
          img.classList.add("nes-switch-online-front");
        }
        if (g.name === "Transformers Battlegrounds") {
          img.classList.add("transformers-battlegrounds-front");
        }

        const url = (g.imageUrl && typeof g.imageUrl === "string") ? g.imageUrl.trim() : "";
        img.src = url || placeholderSVG(g.name);
        img.onerror = () => { img.src = placeholderSVG(g.name); };

        cover.appendChild(img);
        cover.appendChild(badge);

        const meta = document.createElement("div");
        meta.className = "meta";

        const name = document.createElement("div");
        name.className = "name";
        name.textContent = g.name;

        const size = document.createElement("div");
        size.className = "size";
        size.textContent = formatGameSize(g.sizeGB);

        meta.appendChild(name);
        meta.appendChild(size);

        card.appendChild(cover);
        card.appendChild(meta);

        card.addEventListener("click", () => toggleSelect(idx));

        frag.appendChild(card);
      });

      elGrid.appendChild(frag);
      updateSummary();
    }

    function toggleSelect(idx){
      if(state.selected.has(idx)) state.selected.delete(idx);
      else state.selected.add(idx);
      render();
      persistLocal();
    }

    function persistLocal(){
      // Nomes preservam as seleções quando há inclusões ou remoções no catálogo.
      const selected = Array.from(state.selected);
      const payload = {
        selected,
        selectedNames: selected.map(i => GAMES[i].name),
        savedAt: new Date().toISOString()
      };
      localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
    }

    function loadLocal(){
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return;
        const parsed = JSON.parse(raw);
        const indexByName = new Map(GAMES.map((g, i) => [g.name, i]));
        // Catálogo anterior às primeiras inclusões, para interpretar índices antigos.
        const legacyNames = ["1-2-Switch","Animal Crossing: New Horizons","Batman: Arkham Trilogy","Crash Bandicoot 4: It’s About Time","Crash Team Racing Nitro-Fueled","Dark Souls Remastered","Diablo III: Eternal Collection","Donkey Kong Country: Tropical Freeze","Donkey Kong Country Returns HD","DOOM Eternal","EA SPORTS FC 26","EA SPORTS FC 27","Everybody 1-2-Switch!","Game Boy – Nintendo Switch Online","Game Boy Advance – Nintendo Switch Online","Hogwarts Legacy","Hollow Knight","Hollow Knight: Silksong","Hyrule Warriors: Age of Calamity","Immortals Fenyx Rising","It Takes Two","LEGO DC Super-Villains","LEGO Harry Potter Collection","LEGO Horizon Adventures","LEGO Jurassic World","LEGO Marvel Super Heroes","LEGO Marvel Super Heroes 2","LEGO NINJAGO Movie Video Game","LEGO Party","Luigi’s Mansion 3","Mario & Luigi: Brothership","Mario Kart 8 Deluxe","Mario Strikers: Battle League","Mario Tennis Aces","Mega Man 11","Mega Man Legacy Collection","Mega Man X: Legacy Collection 1 + 2 for Nintendo Switch","Mega Man Zero/ZX Legacy Collection","Metroid Dread","MGS Master Collection Vol. 1","Minecraft","Minecraft (Nintendo Switch Edition)","Minecraft Legends","Minecraft Story Mode","Monster Hunter Rise","Mortal Kombat 1","New Super Mario Bros. U Deluxe","Ninja Gaiden: Master Collection","Nintendo 64 – Nintendo Switch Online","Nintendo Entertainment System – Nintendo Switch Online","Nintendo Switch Sports","Nintendo World Championships: NES Edition","Persona 5 Royal","Pokkén Tournament DX","Pokémon Brilliant Diamond","Pokémon Legends: Arceus","Pokémon Legends: Z‑A","Pokémon Mystery Dungeon: Rescue Team DX","Pokémon Quest","Pokémon Scarlet","Pokémon Shining Pearl","Pokémon Shield","Pokémon Sword","Pokémon: Let’s Go, Eevee!","Pokémon: Let’s Go, Pikachu!","Pokémon Violet","Red Dead Redemption","Resident Evil 0","SEGA Genesis – Nintendo Switch Online","Sifu","Shin Megami Tensei V","Ship of Harkinian (OOT native port)","Sonic Mania","Sonic Racing Cross Worlds","Splatoon 3","Streets of Rage 4","Super Bomberman R","Super Bomberman R2","Super Mario 3D All-Stars","Super Mario 3D World + Bowser’s Fury","Super Mario Bros. Wonder","Super Mario Galaxy + Super Mario Galaxy 2","Super Mario Odyssey","Super Mario Party Jamboree","Super Mario RPG","Super Nintendo Entertainment System – Nintendo Switch Online","Super Smash Bros. Ultimate","Teenage Mutant Ninja Turtles: Shredder’s Revenge","The Elder Scrolls V: Skyrim","The Legend of Zelda: Breath of the Wild","The Legend of Zelda: Echoes of Wisdom","The Legend of Zelda: Link’s Awakening","The Legend of Zelda: Skyward Sword HD","The Legend of Zelda: Tears of the Kingdom","The Witcher 3: Wild Hunt – Complete Edition","Tomb Raider I–III Remastered","Top Racer Collection","Ultra Street Fighter II: The Final Challengers","Xenoblade Chronicles X: Definitive Edition","YouTube (oficial)"];
        const indicesOf = (name) => {
          if (name === "Mega Man X: Legacy Collection 1 + 2 for Nintendo Switch" ||
              name === "Mega Man X Legacy Collection" ||
              name === "Mega Man X Legacy Collection 2")
            return [indexByName.get("Mega Man X Legacy Collection 1+2")];
          // Mantém seleções salvas de ambas as edições avulsas.
          if (name === "Mega Man Legacy Collection" ||
              name === "Mega Man Legacy Collection 2")
            return [indexByName.get("Mega Man Legacy Collection 1 + 2")];
          if (name === "Ninja Gaiden: Master Collection" ||
              name === "Ninja Gaiden 3 Razors Edge" ||
              name === "Ninja Gaiden Sigma" ||
              name === "Ninja Gaiden Sigma 2")
            return [indexByName.get("Ninja Gaiden - Master Collection")];
          if (name === "Rayman")
            return [indexByName.get("Rayman: 30th Anniversary Edition")];
          if (name === "Pokemon Fire Red" || name === "Pokemon Leaf Green")
            return [indexByName.get("Pokémon FireRed and LeafGreen")];
          if (name === "My Universe Series for Nintendo Switch")
            return [indexByName.get("My Universe - Pet Clinic Cats and Dogs")];
          if (name === "ULTIMATE NINJA STORM 4 ROAD TO BORUTO")
            return [indexByName.get("Naruto Shippuden Ultimate Ninja Storm 4 Road to Boruto")];
          if (name === "Trials Rising [NSP]")
            return [indexByName.get("Trial Rising")];
          return [indexByName.get(name)];
        };
        if (Array.isArray(parsed.selectedNames)) {
          state.selected = new Set(parsed.selectedNames.flatMap(indicesOf).filter(Number.isInteger));
        } else if (Array.isArray(parsed.selected)) {
          // Conversão dos índices das primeiras versões do catálogo para nomes.
          const oldNames = parsed.selected
            .map(i => i === 10 ? -1 : i === 11 ? 10 : i)
            .map(i => i >= 0 && Number.isInteger(i) ? legacyNames[i] : undefined)
            .filter(Boolean);
          state.selected = new Set(oldNames.flatMap(indicesOf).filter(Number.isInteger));
        }
      } catch (e) {}
    }

    async function saveToSheets(){
      if(!GOOGLE_SHEETS_WEBAPP_URL || GOOGLE_SHEETS_WEBAPP_URL.includes("COLE_AQUI")){
        showToast("Configure a URL do Web App do Google Sheets no código.");
        return;
      }

      const selectedItems = Array.from(state.selected).map(i => ({
        name: GAMES[i].name,
        sizeGB: GAMES[i].sizeGB
      }));

      const payload = {
        savedAtISO: new Date().toISOString(),
        savedAtLocal: new Date().toLocaleString("pt-BR"),
        totalGB: getTotalGB(),
        count: selectedItems.length,
        items: selectedItems
      };

      const saveButton = document.getElementById("saveSheetsBtn");
      saveButton.disabled = true;
      saveButton.textContent = "Salvando...";
      saveButton.classList.remove("success", "error");

      try{
        const res = await fetch(GOOGLE_SHEETS_WEBAPP_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(payload)
        });

        const data = await res.json().catch(()=> ({}));
        if(!res.ok || data.ok === false){
          throw new Error(data.error || `Falha ao salvar (${res.status})`);
        }

        saveButton.textContent = "✓ Lista salva!";
        saveButton.classList.add("success");
        showToast("Lista de jogos salva com sucesso!", "success");
      }catch(err){
        console.error(err);
        saveButton.textContent = "Falha ao salvar";
        saveButton.classList.add("error");
        showToast("Não foi possível salvar a lista. Tente novamente.", "error");
      }finally{
        setTimeout(() => {
          saveButton.disabled = false;
          saveButton.textContent = "Salvar lista de jogos";
          saveButton.classList.remove("success", "error");
        }, 4000);
      }
    }

    document.getElementById("clearBtn").addEventListener("click", () => {
      state.selected.clear();
      render();
      persistLocal();
      showToast("Seleção limpa.");
    });

    document.getElementById("saveSheetsBtn").addEventListener("click", saveToSheets);

    elQ.addEventListener("input", (e) => {
      state.query = e.target.value || "";
      render();
    });

    // IMPORTANTE:
    // - Para o fetch("./covers.json") funcionar, abra via servidor (não file://).
    //   Ex.: npx serve .   ou   python -m http.server
    (async () => {
      loadLocal();
      await applyCoversFromJson(); // <- aqui preenche imageUrl
      render();
    })();
